<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaily</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: url('https://www.loliapi.com/acg/pc/') no-repeat center center fixed;
            background-size: cover;
        }

        /* 进场动画 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeInUp 0.8s ease forwards; }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }

        /* 遮罩层 - 默认显示 */
        .overlay { 
            position: absolute; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 1; 
            transition: opacity 0.5s ease;
        }
        /* 明亮模式类 - 隐藏遮罩 */
        .light-mode .overlay { opacity: 0; }

        #particles-js { position: absolute; width: 100%; height: 100%; z-index: 2; }

        /* 右上角按钮样式 */
        .mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .mode-toggle:hover { background: rgba(255, 255, 255, 0.4); }

        .content {
            position: absolute; top: 0; left: 0; width: 100%; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; pointer-events: none;
        }

        .avatar-link { display: block; margin-bottom: 20px; pointer-events: auto; opacity: 0; transition: transform 0.3s ease; }
        .avatar-link:hover { transform: scale(1.1); }
        .avatar { width: 120px; height: 120px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.3); box-shadow: 0 4px 15px rgba(0,0,0,0.3); object-fit: cover; }

        h1 { color: #fff; margin-bottom: 40px; font-weight: 300; text-shadow: 0 2px 4px rgba(0,0,0,0.3); opacity: 0; }
        .btn-container { display: flex; gap: 20px; pointer-events: auto; opacity: 0; }
        .btn { padding: 15px 30px; font-size: 18px; font-weight: 600; color: white; border: none; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; text-decoration: none; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn:hover { background: rgba(255, 255, 255, 0.35); transform: scale(1.1); }

        .hitokoto-box {
            position: absolute; bottom: 40px; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; padding: 12px 24px; color: #fff; font-family: "DengXian", "等线", sans-serif;
            font-size: 14px; text-align: center; max-width: 80%; pointer-events: auto; opacity: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <button class="mode-toggle" onclick="toggleMode()">明亮模式</button>
    <div class="overlay"></div>
    <div id="particles-js"></div>

    <div class="content">
        <a href="https://ownblogs.dpdns.org" class="avatar-link fade-in">
            <img src="https://pic1.imgdb.cn/item/6a15c92a7e05763db3cf5032.jpg" alt="头像" class="avatar">
        </a>
        
        <h1 class="fade-in delay-1">Jaily</h1>
        
        <div class="btn-container fade-in delay-2">
            <a href="https://panyc123.github.io/dis/" class="btn">Dino</a>
            <a href="https://ai.canons.dpdns.org/2048" class="btn">2048</a>
            <a href="https://ai.canons.dpdns.org/calcu" class="btn">Calcu</a>
        </div>

        <div class="hitokoto-box fade-in delay-3" id="hitokoto">
            <span id="hitokoto-text">正在加载一言...</span>
        </div>
    </div>

    <script>
        // 切换明亮模式
        function toggleMode() {
            document.body.classList.toggle('light-mode');
            const btn = document.querySelector('.mode-toggle');
            btn.innerText = document.body.classList.contains('light-mode') ? '恢复遮罩' : '明亮模式';
        }

        // 获取一言
        fetch('https://v1.hitokoto.cn/')
            .then(res => res.json())
            .then(data => {
                document.getElementById('hitokoto-text').innerText = `${data.hitokoto} —— ${data.from}`;
            })
            .catch(() => {
                document.getElementById('hitokoto-text').innerText = "生活明朗，万物可爱。";
            });

        // 粒子背景配置
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "opacity": { "value": 0.4 },
                "size": { "value": 2 },
                "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.3 },
                "move": { "enable": true, "speed": 1.5 }
            },
            "interactivity": { "events": { "onhover": { "enable": true, "mode": "bubble" } } }
        });
    </script>
</body>
</html>
